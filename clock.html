<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .clock {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5);
        }

        .timezone-name {
            font-size: 18px;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .time-display {
            font-size: 48px;
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            font-family: 'Digital-7', 'Courier New', monospace;
        }

        .date-display {
            font-size: 14px;
            color: #b0b0ff;
            margin-bottom: 8px;
        }

        .offset {
            font-size: 12px;
            color: #80d0ff;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .time-display {
                font-size: 36px;
            }

            .timezone-name {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="clockContainer"></div>

    <script>
        const timezones = [
            { name: 'New York', tz: 'America/New_York' },
            { name: 'London', tz: 'Europe/London' },
            { name: 'Tokyo', tz: 'Asia/Tokyo' },
            { name: 'Sydney', tz: 'Australia/Sydney' },
            { name: 'Dubai', tz: 'Asia/Dubai' },
            { name: 'Singapore', tz: 'Asia/Singapore' },
            { name: 'Mumbai', tz: 'Asia/Kolkata' },
            { name: 'São Paulo', tz: 'America/Sao_Paulo' },
            { name: 'Los Angeles', tz: 'America/Los_Angeles' },
            { name: 'Paris', tz: 'Europe/Paris' },
            { name: 'Hong Kong', tz: 'Asia/Hong_Kong' },
            { name: 'Bangkok', tz: 'Asia/Bangkok' }
        ];

        function createClockElement(timezone) {
            const clockDiv = document.createElement('div');
            clockDiv.className = 'clock';
            clockDiv.innerHTML = `
                <div class="timezone-name">${timezone.name}</div>
                <div class="time-display" id="time-${timezone.tz}">--:--:--</div>
                <div class="date-display" id="date-${timezone.tz}">--/--/----</div>
                <div class="offset" id="offset-${timezone.tz}">UTC offset</div>
            `;
            return clockDiv;
        }

        function updateClock(timezone) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone.tz,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const dateFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone.tz,
                month: '2-digit',
                day: '2-digit',
                year: 'numeric'
            });

            const timeString = formatter.format(now);
            const dateString = dateFormatter.format(now);

            // Calculate UTC offset
            const tzTime = new Date(now.toLocaleString('en-US', { timeZone: timezone.tz }));
            const offset = (now - tzTime) / (1000 * 60 * 60);
            const sign = offset > 0 ? '+' : '';
            const offsetString = `UTC ${sign}${offset.toFixed(1)}`;

            document.getElementById(`time-${timezone.tz}`).textContent = timeString;
            document.getElementById(`date-${timezone.tz}`).textContent = dateString;
            document.getElementById(`offset-${timezone.tz}`).textContent = offsetString;
        }

        function initializeClocks() {
            const container = document.getElementById('clockContainer');
            timezones.forEach(timezone => {
                container.appendChild(createClockElement(timezone));
            });
        }

        function updateAllClocks() {
            timezones.forEach(timezone => updateClock(timezone));
        }

        // Initialize on load
        initializeClocks();
        updateAllClocks();

        // Update every second
        setInterval(updateAllClocks, 1000);
    </script>
</body>
</html>
